services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile.chatbot
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  kwonri:
    build:
      context: .
      dockerfile: Dockerfile.kwonri
    ports:
      - "8001:8001"
    restart: always

  report_pred:
    build:
      context: ./report_pred_api
      dockerfile: Dockerfile.report_pred
    ports:
      - "8002:8002"
    restart: always
